name: Ambiente de Producao

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout do codigo
      uses: actions/checkout@v4
  Imagem:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Docker Login 
      uses: docker/login-action@v4.1.0
      with:
          username: ${{secrets.DOCKER_USER}}
          password: ${{secrets.DOCKER_PWD}}
    
    - name: Configurar o Docker na VM
      uses: docker/build-push-action@v7.1.0
      with:
          push: true
          tags: |
              lucasr32/prod_leopoldina:latest
              lucasr32/prod_leopoldina:${{github.sha}}

  DEPLOY:
    name: Implantando na EC2
    runs-on: ubuntu-latest
    needs: Imagem

    steps:
      - name: Deploy na EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.EC2_HOST_PROD}}
          username: ${{secrets.EC2_USER_PROD}}
          key: ${{secrets.EC2_KEY_PROD}}
          script: |
            # teste de acesso
            echo "Acesso liberado"
            
            # fazer o pull da imagem dockerhub
            sudo docker pull lucasr32/prod_leopoldina:latest

            # Parar o app atual remover o container
            sudo docker stop prod_leopoldina 2>/dev/null || true
            sudo docker rm prod_leopoldina 2>/dev/null || true

            # Publicar novo container
            sudo docker run --name prod_leopoldina -d -p 80:80 lucasr32/prod_leopoldina:latest
